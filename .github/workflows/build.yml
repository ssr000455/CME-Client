name: Build CME Client

on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Android NDK (Manually)
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r26b-linux.zip
          unzip -q android-ndk-r26b-linux.zip
          echo "ANDROID_NDK_HOME=$GITHUB_WORKSPACE/android-ndk-r26b" >> $GITHUB_ENV

      - name: Generate ImGui Sources using Official Generator
        run: |
          git clone --depth 1 --branch v1.86.11 --recurse-submodules --shallow-submodules https://github.com/SpaiR/imgui-java.git /tmp/imgui-java
          rm -rf /tmp/imgui-java/include/imnodes/vcpkg

          cd /tmp/imgui-java
          
          python3 << 'PYEOF'
          file_path = 'buildSrc/src/main/groovy/tool/generator/GenerateLibs.groovy'
          with open(file_path, 'r') as f:
              content = f.read()
          target = "BuildExecutor.executeAnt(jniDir + '/build.xml', '-v', 'pack-natives')"
          content = content.replace(target, "return")
          with open(file_path, 'w') as f:
              f.write(content)
          PYEOF

          ./gradlew imgui-binding:generateLibs -Denvs=linux || true

          if [ ! -d "/tmp/imgui/jni" ]; then
            echo "源码生成失败"
            exit 1
          fi

          mkdir -p $GITHUB_WORKSPACE/src/main/cpp/generated
          cp -r /tmp/imgui/jni/* $GITHUB_WORKSPACE/src/main/cpp/generated/

      - name: Fix JNI Version for Android
        run: |
          # Android NDK 没有 JNI_VERSION_1_8 宏，全局替换为 1.6
          find $GITHUB_WORKSPACE/src/main/cpp/generated -type f -name "*.cpp" -exec sed -i 's/JNI_VERSION_1_8/JNI_VERSION_1_6/g' {} +

      - name: Compile with Android NDK (CMake)
        run: |
          cat > CMakeLists.txt << 'CMEOF'
          cmake_minimum_required(VERSION 3.22)
          project(imgui-java64)
          set(CMAKE_CXX_STANDARD 17)

          file(GLOB_RECURSE JNI_SOURCES "src/main/cpp/generated/*.cpp")

          add_library(imgui-java64 SHARED ${JNI_SOURCES})

          target_include_directories(imgui-java64 PRIVATE
            "src/main/cpp/generated"
            "src/main/cpp/generated/misc/cpp"
          )

          # 关闭 format-security 相关的错误拦截
          target_compile_options(imgui-java64 PRIVATE 
            -Wno-error=format-security 
            -Wno-format-security
          )

          target_compile_definitions(imgui-java64 PRIVATE
            "IMGUI_IMPL_API=extern \"C\""
          )

          target_link_libraries(imgui-java64 PRIVATE log android)

          set_target_properties(imgui-java64 PROPERTIES
            PREFIX "lib"
            OUTPUT_NAME "imgui-java64"
          )
          CMEOF

          cmake -B build-arm64 \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DANDROID_STL=c++_shared \
            -DCMAKE_BUILD_TYPE=Release \
            -S . -B build-arm64

          cmake --build build-arm64 -j$(nproc)

          mkdir -p src/main/resources/natives/linux-arm64
          cp build-arm64/libimgui-java64.so src/main/resources/natives/linux-arm64/

      - name: Build Fabric Mod
        run: |
          chmod +x ./gradlew
          ./gradlew build -x check

      - name: Upload Mod
        uses: actions/upload-artifact@v4
        with:
          name: CME-Client
          path: build/libs/*.jar