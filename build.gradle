plugins {
id 'fabric-loom' version '1.6-SNAPSHOT'
id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
archivesName = project.archives_base_name
}

repositories {
mavenCentral()
}

loom {
    accessWidenerPath = file("src/main/resources/cmeclient.accesswidener")
    splitEnvironmentSourceSets()

mods {
"cmeclient" {
sourceSet sourceSets.main
sourceSet sourceSets.client
}
}
}

dependencies {
minecraft "com.mojang:minecraft:${project.minecraft_version}"
mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // ImGui Java 绑定库
    include implementation("io.github.spair:imgui-java-binding:${project.imgui_version}")
    
    // LWJGL3 后端 (排除自带 lwjgl，避免与 Minecraft 冲突)
    include implementation("io.github.spair:imgui-java-lwjgl3:${project.imgui_version}") {
        exclude group: 'org.lwjgl'
    }
}

processResources {
inputs.property "version", project.version

filesMatching("fabric.mod.json") {
expand "version": project.version
}
}

tasks.withType(JavaCompile).configureEach {
it.options.release = 17
}

java {
withSourcesJar()
sourceCompatibility = JavaVersion.VERSION_17
targetCompatibility = JavaVersion.VERSION_17
}

jar {
from("LICENSE") {
rename { "${it}_${project.base.archivesName.get()}"}
}
}

publishing {
publications {
create("mavenJava", MavenPublication) {
artifactId = project.archives_base_name
from components.java
}
}
repositories {
}
}
